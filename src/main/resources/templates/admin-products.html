<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>商品管理(管理者)</title></head>
<body>
<h1>商品管理画面(管理者専用)</h1>
<table border="1">
    <tr><th>ID</th><th>商品名</th><th>価格</th><th>在庫</th></tr>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.stock}"></td>
    </tr>
</table>
</body>
</html>
