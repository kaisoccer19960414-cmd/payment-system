<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>商品管理(管理者)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">商品管理画面(管理者専用)</h1>
<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr><th>ID</th><th>商品名</th><th>価格</th><th>在庫</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.stock}"></td>
        <td>
            <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">編集</a>
            <a th:href="@{/admin/products/{id}/stock(id=${p.id})}" class="btn btn-sm btn-outline-warning">在庫変更</a>
            <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-sm btn-outline-danger"
                        onclick="return confirm('本当に削除しますか?')">削除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<a th:href="@{/admin/products/new}" class="btn btn-success mt-3">新規登録</a>
</body>
</html>
