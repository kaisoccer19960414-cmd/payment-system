<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>カート</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">カート</h1>

<table class="table table-bordered">
    <thead class="table-dark">
    <tr><th>商品名</th><th>単価</th><th>数量</th><th>小計</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="item, stat : ${items}">
        <td th:text="${item.productName}"></td>
        <td th:text="${item.price} + '円'"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.price * item.quantity} + '円'"></td>
        <td>
            <form th:action="@{/cart/{index}/remove(index=${stat.index})}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p class="fs-4">合計: <span th:text="${totalPrice}"></span>円</p>

<form th:action="@{/cart/checkout}" method="post">
    <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(items)}">購入を確定する</button>
</form>
</body>
</html>
