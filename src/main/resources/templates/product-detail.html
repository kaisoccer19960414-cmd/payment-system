<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>商品詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 th:text="${product.name}"></h1>
<p class="fs-4">価格: <span th:text="${product.price}"></span>円</p>
<p>在庫: <span th:text="${product.stock}"></span>個</p>
<a th:href="@{/products}" class="btn btn-secondary">一覧に戻る</a>
</body>
</html>
