<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>注文履歴</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">注文履歴</h1>
<div th:each="order : ${orders}" class="card mb-3">
    <div class="card-body">
        <h5 class="card-title">
            注文ID: <span th:text="${order.id}"></span> / 合計: <span th:text="${order.totalPrice}"></span>円
        </h5>
        <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="item : ${order.items}">
                商品ID: <span th:text="${item.productId}"></span> ×
                <span th:text="${item.quantity}"></span>個
            </li>
        </ul>
    </div>
</div>
</body>
</html>
