<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>商品一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">商品一覧</h1>
<form th:action="@{/products}" method="get" class="mb-4">
    <div class="input-group">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="商品名で検索">
        <button type="submit" class="btn btn-primary">検索</button>
        <a th:href="@{/products}" class="btn btn-outline-secondary">クリア</a>
    </div>
</form>
<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr><th>ID</th><th>商品名</th><th>価格</th><th>在庫</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></td>
        <td th:text="${p.price} + '円'"></td>
        <td th:text="${p.stock}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
