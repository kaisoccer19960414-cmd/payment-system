<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>注文確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">注文内容の確認</h1>

<table class="table table-bordered">
    <tr><th>商品名</th><td th:text="${productName}"></td></tr>
    <tr><th>単価</th><td th:text="${price} + '円'"></td></tr>
    <tr><th>数量</th><td th:text="${quantity} + '個'"></td></tr>
    <tr><th>合計</th><td th:text="${totalPrice} + '円'"></td></tr>
</table>

<form th:action="@{/purchase/{id}(id=${userId})}" method="post">
    <input type="hidden" name="productId" th:value="${productId}">
    <input type="hidden" name="quantity" th:value="${quantity}">
    <button type="submit" class="btn btn-success">この内容で購入を確定する</button>
    <a th:href="@{/purchase/{id}(id=${userId})}" class="btn btn-secondary">戻る</a>
</form>
</body>
</html>
