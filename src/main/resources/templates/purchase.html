<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>購入画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">購入画面</h1>
<p class="fs-5" th:text="${user.name} + 'さんの残高: ' + ${user.balance} + '円'"></p>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/purchase/{id}(id=${user.id})}" method="post" class="row g-3 align-items-center">
    <div class="col-auto">
        <select name="productId" class="form-select">
            <option th:each="p : ${products}"
                    th:value="${p.id}"
                    th:text="${p.name} + '(' + ${p.price} + '円 / 在庫' + ${p.stock} + ')'">
            </option>
        </select>
    </div>
    <div class="col-auto">
        <input type="number" name="quantity" value="1" min="1" class="form-control" style="width: 100px;">
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-success">購入する</button>
    </div>
</form>
</body>
</html>
