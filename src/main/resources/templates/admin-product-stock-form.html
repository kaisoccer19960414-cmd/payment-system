<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>在庫変更</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">在庫変更</h1>

<p class="fs-5">
    商品名: <span th:text="${productName}"></span> /
    現在の在庫: <span th:text="${currentStock}"></span>個
</p>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/admin/products/{id}/stock(id=${productId})}" method="post" th:object="${stockAdjustRequest}" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">増減数(入荷はプラス、出荷・減耗はマイナス)</label>
        <input type="number" th:field="*{quantity}" class="form-control">
        <div class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
    </div>

    <button type="submit" class="btn btn-success">変更する</button>
    <a th:href="@{/admin/products}" class="btn btn-secondary">キャンセル</a>
</form>
</body>
</html>
