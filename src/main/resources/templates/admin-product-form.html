<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>商品登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">商品登録</h1>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/admin/products}" method="post" th:object="${productCreateRequest}" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">商品名</label>
        <input type="text" th:field="*{name}" class="form-control">
        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">価格(円)</label>
        <input type="number" th:field="*{price}" class="form-control">
        <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">在庫数</label>
        <input type="number" th:field="*{stock}" class="form-control">
        <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
    </div>

    <button type="submit" class="btn btn-success">登録する</button>
    <a th:href="@{/admin/products}" class="btn btn-secondary">キャンセル</a>
</form>
</body>
</html>
